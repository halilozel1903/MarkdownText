<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" role="img" aria-label="MarkdownText: a SwiftUI Markdown renderer for iPhone and Mac" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1E1B4B"/>
      <stop offset="0.55" stop-color="#312E81"/>
      <stop offset="1" stop-color="#701A75"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#A5B4FC"/>
      <stop offset="1" stop-color="#F9A8D4"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#818CF8"/>
      <stop offset="1" stop-color="#F472B6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1280" height="560" fill="url(#bg)"/>
  <circle cx="1180" cy="40" r="220" fill="#EC4899" opacity="0.12"/>
  <circle cx="60" cy="560" r="200" fill="#6366F1" opacity="0.18"/>

  <!-- Title block -->
  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
    <text x="72" y="150" font-size="60" font-weight="700" fill="#FFFFFF">MarkdownText</text>
    <rect x="74" y="170" width="120" height="6" rx="3" fill="url(#accent)"/>
    <text x="72" y="222" font-size="23" fill="#E0E7FF">Render Markdown with native SwiftUI</text>
    <text x="72" y="254" font-size="23" fill="#E0E7FF">views on iPhone and Mac.</text>
    <text x="72" y="286" font-size="23" fill="#E0E7FF">No dependencies.</text>

    <!-- Feature chips -->
    <g font-size="17" font-weight="600" fill="#FFFFFF">
      <rect x="72" y="320" width="150" height="40" rx="20" fill="#FFFFFF" fill-opacity="0.12" stroke="#A5B4FC" stroke-opacity="0.5"/>
      <text x="147" y="346" text-anchor="middle">CommonMark</text>
      <rect x="234" y="320" width="140" height="40" rx="20" fill="#FFFFFF" fill-opacity="0.12" stroke="#A5B4FC" stroke-opacity="0.5"/>
      <text x="304" y="346" text-anchor="middle">GFM tables</text>
      <rect x="386" y="320" width="130" height="40" rx="20" fill="#FFFFFF" fill-opacity="0.12" stroke="#A5B4FC" stroke-opacity="0.5"/>
      <text x="451" y="346" text-anchor="middle">Task lists</text>
      <rect x="72" y="372" width="210" height="40" rx="20" fill="#FFFFFF" fill-opacity="0.12" stroke="#F9A8D4" stroke-opacity="0.5"/>
      <text x="177" y="398" text-anchor="middle">Syntax highlighting</text>
      <rect x="294" y="372" width="104" height="40" rx="20" fill="#FFFFFF" fill-opacity="0.12" stroke="#F9A8D4" stroke-opacity="0.5"/>
      <text x="346" y="398" text-anchor="middle">Themes</text>
      <rect x="410" y="372" width="150" height="40" rx="20" fill="#FFFFFF" fill-opacity="0.12" stroke="#F9A8D4" stroke-opacity="0.5"/>
      <text x="485" y="398" text-anchor="middle">Dynamic Type</text>
    </g>
    <text x="72" y="466" font-size="17" fill="#C7D2FE">Swift 6.2 · iOS 17+ · macOS 14+ · Swift Package Manager</text>
  </g>

  <!-- Mac window illustration: a rendered page -->
  <g filter="url(#shadow)" transform="translate(50 0)">
    <rect x="640" y="92" width="560" height="380" rx="18" fill="#FFFFFF"/>
    <path d="M640 110 a18 18 0 0 1 18 -18 h524 a18 18 0 0 1 18 18 v28 h-560 z" fill="#EEF0F6"/>
    <circle cx="664" cy="115" r="6.5" fill="#FF5F57"/>
    <circle cx="686" cy="115" r="6.5" fill="#FEBC2E"/>
    <circle cx="708" cy="115" r="6.5" fill="#28C840"/>
    <rect x="640" y="138" width="560" height="1" fill="#DDE1EA"/>
    <!-- heading with a divider -->
    <rect x="800" y="164" width="220" height="22" rx="11" fill="#312E81"/>
    <rect x="800" y="198" width="370" height="1.5" fill="#E2E8F0"/>
    <rect x="800" y="214" width="360" height="9" rx="4.5" fill="#CBD5E1"/>
    <rect x="800" y="232" width="320" height="9" rx="4.5" fill="#CBD5E1"/>
    <!-- table -->
    <g stroke="#E2E8F0" stroke-width="1.5">
      <rect x="800" y="258" width="370" height="96" rx="8" fill="#FFFFFF"/>
      <rect x="800" y="258" width="370" height="32" rx="8" fill="#EEF2FF"/>
      <line x1="800" y1="290" x2="1170" y2="290"/>
      <line x1="800" y1="322" x2="1170" y2="322"/>
      <line x1="924" y1="258" x2="924" y2="354"/>
      <line x1="1048" y1="258" x2="1048" y2="354"/>
    </g>
    <g fill="#94A3B8">
      <rect x="816" y="270" width="70" height="8" rx="4" fill="#6366F1"/>
      <rect x="940" y="270" width="80" height="8" rx="4" fill="#6366F1"/>
      <rect x="1064" y="270" width="60" height="8" rx="4" fill="#6366F1"/>
      <rect x="816" y="302" width="90" height="8" rx="4"/>
      <rect x="940" y="302" width="60" height="8" rx="4"/>
      <rect x="1064" y="302" width="84" height="8" rx="4"/>
      <rect x="816" y="334" width="64" height="8" rx="4"/>
      <rect x="940" y="334" width="90" height="8" rx="4"/>
      <rect x="1064" y="334" width="50" height="8" rx="4"/>
    </g>
    <!-- task list -->
    <rect x="800" y="376" width="18" height="18" rx="5" fill="#6366F1"/>
    <path d="M804.5 385 l4 4 l6.5 -8" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="830" y="381" width="190" height="9" rx="4.5" fill="#CBD5E1"/>
    <rect x="800" y="408" width="18" height="18" rx="5" fill="#6366F1"/>
    <path d="M804.5 417 l4 4 l6.5 -8" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="830" y="413" width="150" height="9" rx="4.5" fill="#CBD5E1"/>
    <rect x="801" y="441" width="16" height="16" rx="4.5" fill="none" stroke="#94A3B8" stroke-width="2"/>
    <rect x="830" y="445" width="170" height="9" rx="4.5" fill="#CBD5E1"/>
  </g>

  <!-- iPhone illustration: a rendered document -->
  <g filter="url(#shadow)" transform="translate(70 0)">
    <rect x="600" y="196" width="186" height="340" rx="36" fill="#0F172A"/>
    <rect x="609" y="205" width="168" height="322" rx="28" fill="#FFFFFF"/>
    <rect x="667" y="215" width="52" height="15" rx="7.5" fill="#0F172A"/>
    <rect x="625" y="248" width="110" height="14" rx="7" fill="#312E81"/>
    <rect x="625" y="272" width="136" height="7" rx="3.5" fill="#CBD5E1"/>
    <rect x="625" y="286" width="118" height="7" rx="3.5" fill="#CBD5E1"/>
    <rect x="625" y="302" width="136" height="76" rx="10" fill="url(#hero)"/>
    <rect x="645" y="322" width="62" height="36" rx="6" fill="#FFFFFF" opacity="0.9"/>
    <rect x="713" y="328" width="34" height="26" rx="6" fill="#FFFFFF" opacity="0.55"/>
    <rect x="625" y="392" width="80" height="10" rx="5" fill="#312E81"/>
    <circle cx="630" cy="420" r="3.5" fill="#94A3B8"/>
    <rect x="640" y="416" width="110" height="7" rx="3.5" fill="#CBD5E1"/>
    <circle cx="630" cy="436" r="3.5" fill="#94A3B8"/>
    <rect x="640" y="432" width="96" height="7" rx="3.5" fill="#CBD5E1"/>
    <circle cx="630" cy="452" r="3.5" fill="#94A3B8"/>
    <rect x="640" y="448" width="104" height="7" rx="3.5" fill="#CBD5E1"/>
    <rect x="625" y="468" width="5" height="34" rx="2.5" fill="#A5B4FC"/>
    <rect x="638" y="472" width="112" height="7" rx="3.5" fill="#94A3B8"/>
    <rect x="638" y="486" width="90" height="7" rx="3.5" fill="#94A3B8"/>
    <rect x="666" y="514" width="54" height="5" rx="2.5" fill="#CBD5E1"/>
  </g>
</svg>
