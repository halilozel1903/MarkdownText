name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift:
    name: Swift tests (macOS)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain
        run: |
          swift --version
          xcodebuild -version
      - name: Build
        run: swift build
      - name: Test
        run: swift test

  test:
    name: Tests (iOS)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - name: Build & test on iOS Simulator
        run: bash scripts/test.sh iOS

  example:
    name: Example apps
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        working-directory: Example
        run: xcodegen generate
      - name: Build for macOS
        run: |
          xcodebuild build \
            -project Example/MarkdownTextDemo.xcodeproj \
            -scheme MarkdownMac \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO
      - name: Build for iOS Simulator
        run: |
          xcodebuild build \
            -project Example/MarkdownTextDemo.xcodeproj \
            -scheme MarkdownPhone \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO

  # MarkdownText is a UI library: the scenes render the example app's bundled demo documents (generic sample text
  # about the library) and its bundled illustration. Nothing is loaded from the network.
  screenshots:
    name: README screenshots
    if: github.event_name != 'pull_request'
    needs: [swift, test, example]
    runs-on: macos-26
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        working-directory: Example
        run: xcodegen generate
      # Writes docs/screenshots/mac-editor.png.
      - name: Capture screenshots (Mac)
        run: bash scripts/screenshots-mac.sh MarkdownTextDemo MarkdownMac editor
      # Writes docs/screenshots/iphone-document.png and iphone-code.png.
      - name: Capture screenshots (iPhone)
        run: bash scripts/screenshots.sh MarkdownTextDemo MarkdownPhone io.github.halilozel1903.MarkdownPhone document code
      - name: Commit screenshots
        run: |
          git config user.name "Halil Özel"
          git config user.email "halilozel1903@gmail.com"
          git add docs/screenshots
          if git diff --cached --quiet; then
            echo "Screenshots unchanged"
          else
            git commit -m "Update README screenshots [skip ci]"
            git push
          fi
